<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Template Editor</title>
  <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header>
      <h1>📄 PDF Template Editor</h1>
      <div class="toolbar">
        <select id="template-select" class="template-select">
          <option value="" disabled selected>Load template…</option>
        </select>
<button id="btn-save"   class="btn btn-primary">Save</button>
        <button id="btn-export" class="btn">Export PDF</button>
      </div>
    </header>

    <main>

      <!-- ── Left Panel ─────────────────────────────────────────────── -->
      <section class="panel left-panel">

        <!-- Variables dropdown -->
        <div class="editor-section">
          <h3>Variables</h3>
          <p class="hint">Pick a variable, then copy it into a component's content.</p>
          <div class="var-row">
            <select id="variable-select" class="var-select">
              <option value="" disabled selected>Loading…</option>
            </select>
            <button id="btn-copy-var" class="btn btn-sm btn-icon" title="Copy {{variable}} to clipboard">
              📋
            </button>
          </div>
          <div id="copy-feedback" class="copy-feedback" style="display:none">Copied!</div>
        </div>

        <!-- Components list -->
        <div class="editor-section">
          <h3>Components</h3>
          <div id="components-list" class="components-list"></div>
          <div class="btn-row">
            <button id="btn-add-text"       class="btn btn-sm">+ Text</button>
            <button id="btn-add-shape"      class="btn btn-sm">+ Shape</button>
            <button id="btn-add-pagebreak"  class="btn btn-sm">+ Page</button>
          </div>
        </div>

      </section>

      <!-- ── Canvas (middle) ────────────────────────────────────────── -->
      <section class="panel canvas-panel">
        <h2>Canvas</h2>
        <div id="canvas-container" class="canvas-container"></div>
      </section>

      <!-- ── Inspector (right) ─────────────────────────────────────── -->
      <section class="panel right-panel">

        <!-- Tab switcher -->
        <div class="panel-tabs">
          <button id="tab-btn-inspector" class="tab-btn tab-btn-active">Inspector</button>
          <button id="tab-btn-pages"     class="tab-btn">Pages</button>
        </div>

        <!-- Inspector tab -->
        <div id="tab-inspector">

        <div id="inspector-empty" class="inspector-empty">
          <p>Select a component to edit</p>
        </div>

        <div id="inspector-properties" style="display:none">

          <div class="inspector-section">
            <label><strong>ID</strong></label>
            <input type="text" id="prop-id" readonly>
          </div>

          <div class="inspector-section">
            <label><strong>Position</strong></label>
            <div class="input-group">
              <input type="number" id="prop-x"      placeholder="X"      min="0" step="1">
              <input type="number" id="prop-y"      placeholder="Y"      min="0" step="1">
            </div>
            <div class="input-group">
              <input type="number" id="prop-width"  placeholder="W"  min="10" step="1">
              <input type="number" id="prop-height" placeholder="H" min="10" step="1">
            </div>
          </div>

          <!-- Text properties -->
          <div id="text-props" class="inspector-section" style="display:none">
            <label><strong>Content</strong></label>
            <textarea id="prop-content" placeholder="Text (supports {{variables}})"></textarea>

            <label><strong>Font</strong></label>
            <select id="prop-font">
              <option value="Helvetica">Helvetica</option>
              <option value="Times-Roman">Times</option>
              <option value="Courier">Courier</option>
            </select>

            <label><strong>Size</strong></label>
            <input type="number" id="prop-size" min="6" max="72" step="1" value="12">

            <label><strong>Align</strong></label>
            <select id="prop-align">
              <option value="left">Left</option>
              <option value="center">Center</option>
              <option value="right">Right</option>
            </select>

            <label><strong>Text color</strong></label>
            <div class="color-row">
              <input type="color" id="prop-text-color"     value="#000000">
              <input type="text"  id="prop-text-color-hex" value="#000000" maxlength="7" placeholder="#000000">
            </div>

            <div class="checkbox-row">
              <label><input type="checkbox" id="prop-bold">   Bold</label>
              <label><input type="checkbox" id="prop-italic"> Italic</label>
            </div>
          </div>

          <!-- Shape properties -->
          <div id="shape-props" class="inspector-section" style="display:none">
            <label><strong>Shape</strong></label>
            <select id="prop-shape-type">
              <option value="rect">Rectangle</option>
              <option value="line">Line</option>
              <option value="circle">Circle</option>
            </select>

            <label><strong>Color</strong></label>
            <div class="color-row">
              <input type="color" id="prop-color" value="#000000">
              <input type="text"  id="prop-color-hex" value="#000000" maxlength="7" placeholder="#000000">
            </div>

            <label><strong>Stroke width</strong></label>
            <input type="number" id="prop-stroke-width" min="0.5" max="20" step="0.5" value="1">

            <div class="checkbox-row">
              <label><input type="checkbox" id="prop-fill"> Fill</label>
            </div>
          </div>

          <button id="btn-delete" class="btn btn-danger btn-sm">Delete Component</button>

        </div>
        </div><!-- /tab-inspector -->

        <!-- Pages tab -->
        <div id="tab-pages" style="display:none">
          <div id="pages-order-list"></div>
        </div>

      </section>

    </main>
  </div>

  <div id="no-template-banner" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:8px;padding:32px 40px;max-width:420px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3);">
      <h2 style="margin:0 0 12px">No PDF template found</h2>
      <p style="color:#555;margin:0 0 24px">This experiment does not have a PDF template yet. Create an empty one to start building.</p>
      <button id="btn-create-template" style="padding:10px 28px;background:#6600ff;color:#fff;border:none;border-radius:4px;font-size:15px;cursor:pointer;">Create template</button>
    </div>
  </div>

  <script src="/static/editor.js"></script>
</body>
</html>
